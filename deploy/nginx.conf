# Reverse proxy for teknodoz-esmaulhusna-ortakofis.org -> the Node.js app on 127.0.0.1:3000.
# Installed by deploy/install.sh. TLS is added by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name teknodoz-esmaulhusna-ortakofis.org;

    client_max_body_size 4k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/png;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
